<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Coelhadas Burguer</title>
</head>

<body>
  <header>
    <img style="width: 40px;" src="./images/logo.svg" alt="">
  </header>

  <main>
    <h1 class="envie-seu-pedido">Envie seu pedido</h1>

    <form action="" method="get">

    <div class="div-indentificacao">
      <div class="div-logo-indentificacao">
        <img class="avatar" src="./images/people_14919882.svg" alt="">
        <h4>Identificação</h4>
      </div>

      <div class="inputs-identificacao">
        <div class="input-name">
          <label for="name">Nome</label>
          <input type="text" name="Nome" id="name">
        </div>

        <div class="input-email">
          <label for="email">Email</label>
          <input type="email" name="Email" id="email">
        </div>
        
      </div>
    </div>

    </form>
  </main>
</body>

</html>
