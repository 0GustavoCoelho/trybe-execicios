<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <title>Login - Spotify</title>
</head>

<body>
  <section>
    <i class="bi bi-spotify"></i>
    <h1>Entrar no Spotify</h1>

    <div>
      <button><i class="bi bi-google"></i> <span> Continuar com o Google</span></button>
      <button><i class="bi bi-facebook"></i> <span> Continuar com o Facebook</span></button>
      <button><i class="bi bi-apple"></i> <span> Continuar com o Apple</span></button>
      <button><i class="bi bi"></i> <span> Continuar com um número de telefone</span></button>
    </div>

    <form action="">
      <label for="email-or-username">E-mail ou nome de usuário</label>
      <input type="text" id="email-or-username" placeholder="E-mail ou nome de usuário">

      <label for="password">Senha</label>
      <input type="password" id="password" placeholder="Senha">

      <button>
        Entrar
      </button>
    </form>

    <a href="#">Esqueceu sua senha</a>
    <p>Não tem uma conta? <a href="">Inscrever-se no Spotify</a></p>
  </section>

  <footer>
    <p>Este site é protegido pelo reCAPTCHA e está sujeito à <a href="">política de Privacidade </a> e aos <a href="">termos de Serviço </a> do Google.
    </p>
  </footer>
</body>

</html>
